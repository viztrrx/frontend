<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="640" height="400">
  <!-- Eaglercraft thumbnail: an original pixel-art grass block over a sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="1" stop-color="#a9d4ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.9">
    <rect x="22" y="26" width="48" height="12"/><rect x="34" y="18" width="24" height="10"/>
    <rect x="236" y="38" width="56" height="12"/><rect x="250" y="30" width="26" height="10"/>
  </g>
  <!-- ground -->
  <rect y="168" width="320" height="32" fill="#6aa83a"/>
  <rect y="176" width="320" height="24" fill="#7a5532"/>
  <g fill="#5e9632"><rect x="0" y="168" width="16" height="8"/><rect x="48" y="168" width="16" height="8"/><rect x="112" y="168" width="16" height="8"/><rect x="208" y="168" width="16" height="8"/><rect x="272" y="168" width="16" height="8"/></g>
  <!-- the block (isometric) -->
  <g transform="translate(160 104)">
    <!-- top: grass -->
    <polygon points="0,-62 54,-31 0,0 -54,-31" fill="#79bf43"/>
    <g fill="#8dd152">
      <polygon points="0,-62 13.5,-54.25 0,-46.5 -13.5,-54.25"/>
      <polygon points="27,-46.5 40.5,-38.75 27,-31 13.5,-38.75"/>
      <polygon points="-27,-31 -13.5,-23.25 -27,-15.5 -40.5,-23.25"/>
      <polygon points="0,-15.5 13.5,-7.75 0,0 -13.5,-7.75"/>
    </g>
    <g fill="#62a334">
      <polygon points="-27,-46.5 -13.5,-38.75 -27,-31 -40.5,-38.75"/>
      <polygon points="27,-15.5 40.5,-7.75 27,0 13.5,-7.75"/>
    </g>
    <!-- left face: dirt with a grass lip -->
    <polygon points="-54,-31 0,0 0,62 -54,31" fill="#8a5f37"/>
    <polygon points="-54,-31 0,0 0,13 -54,-18" fill="#5f9b33"/>
    <g fill="#6b4627">
      <polygon points="-45,-4 -36,1 -36,10 -45,5"/><polygon points="-18,14 -9,19 -9,28 -18,23"/>
      <polygon points="-36,22 -27,27 -27,36 -36,31"/><polygon points="-14,40 -5,45 -5,54 -14,49"/>
    </g>
    <!-- right face: darker dirt -->
    <polygon points="54,-31 0,0 0,62 54,31" fill="#6f4a2a"/>
    <polygon points="54,-31 0,0 0,13 54,-18" fill="#4f8529"/>
    <g fill="#563820">
      <polygon points="36,1 45,-4 45,5 36,10"/><polygon points="9,19 18,14 18,23 9,28"/>
      <polygon points="27,27 36,22 36,31 27,36"/><polygon points="5,45 14,40 14,49 5,54"/>
    </g>
  </g>
  <text x="160" y="194" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" stroke="#2b2b2b" stroke-width="3" paint-order="stroke">EAGLERCRAFT 1.8</text>
</svg>
