<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="pragma" content="no-cache"/>
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name ="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <style>
            body {
              background: #000;
              color:#cccccc;
              margin: 0px;
              padding: 0px;
              border: 0px;
              overflow: hidden;
            }
            canvas {
                      image-rendering: optimizeSpeed;
                      image-rendering: -moz-crisp-edges;
                      image-rendering: -webkit-optimize-contrast;
                      image-rendering: crisp-edges;
                      image-rendering: pixelated;
                      -webkit-interpolation-mode: nearest-neighbor;
                      -ms-touch-action: none;
                      margin: 0px;
                      padding: 0px;
                      border: 0px;
            }
            :-webkit-full-screen #canvas {
                 width: 100%;
                 height: 100%;
            }
            div.gm4html5_div_class
            {
              margin: 0px;
              padding: 0px;
              border: 0px;
            }
            /* START - Login Dialog Box */
            div.gm4html5_login
            {
                 padding: 20px;
                 position: absolute;
                 border: solid 2px #000000;
                 background-color: #404040;
                 color:#00ff00;
                 border-radius: 15px;
                 box-shadow: #101010 20px 20px 40px;
            }
            div.gm4html5_cancel_button
            {
                 float: right;
            }
            div.gm4html5_login_button
            {
                 float: left;
            }
            div.gm4html5_login_header
            {
                 text-align: center;
            }
            /* END - Login Dialog Box */
            :-webkit-full-screen {
               width: 100%;
               height: 100%;
            }
        </style>
    </head>

    <body>
        <div class="gm4html5_div_class" id="gm4html5_div_id">
        <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display:none;"/>
            <!-- Create the canvas element the game draws to -->
            <canvas id="canvas">
                     <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
            <script>
                // Fit the game to the frame it's in.
                //
                // The menus draw on GameMaker's GUI layer, which it scales to the
                // canvas, so they fill the frame on their own. A match doesn't:
                // starting one calls window_set_size(960, 540), and the runtime
                // answers that by setting the canvas's width/height attributes and
                // nothing else, so the canvas collapses to 960x540 CSS pixels and
                // the match sits unscaled in the top-left corner.
                //
                // So leave the drawing size to the game and set only the CSS size:
                // scale the canvas up to fill the frame, keeping its aspect ratio
                // and centering what's left over. The runtime recomputes mouse
                // coordinates from clientWidth/width every frame, so clicks, drags
                // and touches still land where they look like they do.
                (function () {
                  var canvas = document.querySelector('canvas');
                  canvas.width = window.innerWidth;
                  canvas.height = window.innerHeight;

                  function set(prop, value) {
                    // Only write when it actually changes: the observer below
                    // watches the style attribute, so idle writes would loop.
                    if (canvas.style[prop] !== value) canvas.style[prop] = value;
                  }
                  function fit() {
                    var w = canvas.width, h = canvas.height;
                    var availW = window.innerWidth, availH = window.innerHeight;
                    if (!w || !h || !availW || !availH) return;
                    var scale = Math.min(availW / w, availH / h);
                    var dw = Math.round(w * scale), dh = Math.round(h * scale);
                    set('position', 'absolute');
                    set('left', Math.round((availW - dw) / 2) + 'px');
                    set('top', Math.round((availH - dh) / 2) + 'px');
                    set('width', dw + 'px');
                    set('height', dh + 'px');
                  }

                  // The game resizes the canvas itself (kickoff, leaving a match)
                  // and moves it on fullscreen, so follow the canvas as well as
                  // the frame.
                  if (window.MutationObserver) {
                    new MutationObserver(fit).observe(canvas,
                      { attributes: true, attributeFilter: ['width', 'height', 'style'] });
                  }
                  window.addEventListener('resize', fit);
                  window.addEventListener('orientationchange', fit);
                  document.addEventListener('fullscreenchange', fit);
                  document.addEventListener('webkitfullscreenchange', fit);
                  fit();
                })();
            </script>
        </div>

        <!-- Run the game code -->
        <script type="text/javascript" src="html5game/RetroBowl.js"></script>
        <script>window.onload = GameMaker_Init;</script>
    </body>
</html>
