<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Proxy</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="config.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div class="flex-center header-center"><h1 class="sj-heading">Search</h1></div>
		<form id="sj-form" class="flex-center">
			<input id="sj-address" type="text" placeholder="Search or enter a website" />
		</form>
		<div id="sj-options" class="flex-center">
			<label>
				Search with
				<select id="sj-search-engine">
					<option value="https://www.google.com/search?q=%s">Google</option>
					<option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
					<option value="https://www.bing.com/search?q=%s">Bing</option>
				</select>
			</label>
			<label>
				<input id="sj-fulltab" type="checkbox" />
				Open sites in the full tab (no frame)
			</label>
		</div>
		<div class="desc left-margin">
			<p id="sj-progress" role="status" hidden></p>
			<p id="sj-error" role="alert"></p>
			<pre id="sj-error-code"></pre>
		</div>
		<div id="sj-loading" role="status" aria-live="polite" hidden>
          <div class="sj-spinner" aria-hidden="true"></div>
          <p id="sj-loading-status">Loading website…</p>
          <p class="sj-hint">Render's free service may take a minute to wake up.</p>
          <button type="button" id="sj-show-page">Show page</button>
        </div>
        <nav id="sj-toolbar" aria-label="Browsing controls" hidden>
          <button type="button" id="sj-close">← Back</button>
          <span id="sj-toolbar-status" aria-live="polite">Loading…</span>
          <button type="button" id="sj-reload">Retry</button>
        </nav>
		<!-- footer removed -->
	</body>
</html>
