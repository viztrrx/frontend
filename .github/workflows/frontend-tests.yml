name: Frontend Tests and Cloudflare Build Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (applies patches/)
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: |
          node --check public/index.js
          node --check public/sw.js
          node --check public/sessions.js
          node --check public/blocked.js
          node --check public/engine2.js
          node --check public/sw2.js
          node --check public/spotify.js
          node --check public/s2/host.js
          node --check public/s2/sw.js
          node --check public/sitefixes.js
          node --check public/youtube.js
          node --check src/index.js
          node --check src/sessions.js
          node --check src/game-parts.js
          node --check tests/frontend.test.mjs
          node --check tests/service-worker.test.mjs
          node --check tests/libcurl-transport.test.mjs
          node --check tests/build.test.mjs
          node --check tests/sessions-api.test.mjs
          node --check tests/blocked.test.mjs
          node --check tests/keepalive.test.mjs
          node --check tests/games.test.mjs
          node --check site-check/run.mjs
      - name: Run frontend regression tests
        run: npm test
      - name: Build Cloudflare Worker assets
        run: pnpm build
      - name: Check Worker packaging without deploying
        run: npx --yes wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Build the Scramjet 2 beta
        run: pnpm build:beta
      - name: Check the beta Worker's packaging without deploying
        run: npx --yes wrangler deploy --dry-run --config wrangler.beta.jsonc --outdir .wrangler-dry-run-beta
