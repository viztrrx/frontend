name: Scramjet Frontend Regression Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/index.js
          node --check public/sw.js
          node --check src/index.js
          node --check tests/frontend.test.mjs
          node --check tests/service-worker.test.mjs
      - name: Run frontend regression tests
        run: npm test
