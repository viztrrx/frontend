name: Diagnose YouTube

# Temporary: builds this branch with both engines, serves them with a local
# Wisp server (diag/lab-server.mjs, so nothing goes through the Render
# backend), plays a YouTube video in headed Google Chrome and records memory,
# video state, requests and crashes (diag/youtube.mjs). Results go to the
# diag-results branch.
on:
  push:
    branches: [diag-youtube]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both engines
        run: |
          pnpm install --frozen-lockfile
          pnpm build && cp -r dist /tmp/dist1
          pnpm build:beta && cp -r dist /tmp/dist2 && cp -r diag/wc /tmp/dist2/diag-wc
      - name: Install Playwright and wisp-js
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.63.0
          npm install --prefix /tmp/wisp --no-audit --no-fund @mercuryworkshop/wisp-js@0.4.1
      - name: Start the local proxy
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/key.pem -out /tmp/cert.pem -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null
          WISP_JS_PATH=/tmp/wisp/node_modules/@mercuryworkshop/wisp-js/src/entrypoints/server.mjs \
            nohup node diag/lab-server.mjs /tmp/dist1 /tmp/dist2 /tmp/cert.pem /tmp/key.pem > /tmp/lab-server.log 2>&1 &
          sleep 3; cat /tmp/lab-server.log
      - name: Save YouTube's desktop scripts for offline study
        run: |
          mkdir -p out/yt
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"
          curl -sL -A "$UA" "https://www.youtube.com/watch?v=jNQXAC9IVRw" -o out/yt/watch.html
          grep -oE '/s/desktop/[a-z0-9]+/jsbin/[A-Za-z0-9_.-]+\.vflset/[A-Za-z0-9_.-]+\.js' out/yt/watch.html | sort -u | tee out/yt/scripts.txt
          while read -r p; do curl -sL -A "$UA" "https://www.youtube.com$p" -o "out/yt/$(basename "$p")"; done < out/yt/scripts.txt
          i=0; while read -r u; do i=$((i+1)); curl -sL -A "$UA" "$u" -o "out/yt/reader-$i.js"; done < diag/sr-readers.txt
          ls -la out/yt
      - name: Play the video
        env:
          PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright/index.mjs
          DEBUG: pw:browser
        run: |
          google-chrome --version
          VIDEO="${{ vars.DIAG_VIDEO || 'https://www.youtube.com/watch?v=jNQXAC9IVRw' }}"
          # name;port;transport;block regex;extra flags
          while IFS=';' read -r name port transport block extra; do
            [ -z "$name" ] && continue
            mkdir -p "out/$name"
            timeout 240 xvfb-run -a node diag/youtube.mjs --headed --insecure --url "http://localhost:$port" --transport "$transport" --block "$block" $extra --video "$VIDEO" --seconds 60 --out "out/$name" 2> "out/$name/browser.log" > "out/$name/stdout.txt" || true
            echo "== $name crashed=$(grep -o '"crashed": [a-z]*' "out/$name/stdout.txt")"
            grep -iE "fatal|check failed|out of memory|oom|v8|renderer|crash" "out/$name/browser.log" | grep -viE "crashpad|cpufreq" | head -15 || true
          done <<'RUNS'
          V-hasinstance;8782;epoxy;;--fix V:hasinstance
          V-hasinstance-libcurl;8782;libcurl;;--fix V:hasinstance
          V-orig;8782;epoxy;;--fix V:orig
          RUNS
          cp /tmp/lab-server.log out/
      - name: Save results to the diag-results branch
        if: always()
        run: |
          git config user.name "diag"; git config user.email "diag@users.noreply.github.com"
          dest="runs/${{ github.run_id }}-${{ github.run_attempt }}"
          git worktree add --no-checkout --detach /tmp/res
          cd /tmp/res
          if git fetch -q --depth 1 origin diag-results 2>/dev/null; then git checkout -q -B diag-results FETCH_HEAD; else git switch -q --orphan diag-results; fi
          mkdir -p "$dest" && cp -r "$GITHUB_WORKSPACE/out/." "$dest/"
          git add -A && git commit -qm "diag ${{ github.run_id }}"
          for i in 1 2 3 4; do git push -q origin HEAD:diag-results && break; sleep $((i*5)); git fetch -q --depth 1 origin diag-results && git rebase -q FETCH_HEAD; done
