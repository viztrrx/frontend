name: Diagnose YouTube

# Temporary: plays a YouTube video through the proxy in Google Chrome and
# records memory, video state, requests and crashes (diag/youtube.mjs).
on:
  push:
    branches: [diag-youtube]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: beta-libcurl
            url: https://frontend-beta.viztrrx.workers.dev
            transport: libcurl
          - name: beta-epoxy
            url: https://frontend-beta.viztrrx.workers.dev
            transport: epoxy
          - name: production-libcurl
            url: https://frontend.viztrrx.workers.dev
            transport: libcurl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.63.0
      - name: Play the video
        env:
          PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright/index.mjs
          DEBUG: pw:browser
        run: |
          google-chrome --version
          node diag/youtube.mjs --url "${{ matrix.url }}" --transport "${{ matrix.transport }}" --out "out/${{ matrix.name }}" 2> "out-${{ matrix.name }}-browser.log" || true
          mkdir -p "out/${{ matrix.name }}" && mv "out-${{ matrix.name }}-browser.log" "out/${{ matrix.name }}/browser.log"
          grep -iE "fatal|check failed|oom|out of memory|crash|trap|signal" "out/${{ matrix.name }}/browser.log" | head -40 || true
      - name: Save results to the diag-results branch
        if: always()
        run: |
          git config user.name "diag"; git config user.email "diag@users.noreply.github.com"
          dest="runs/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.name }}"
          git worktree add --no-checkout --detach /tmp/res
          cd /tmp/res
          if git fetch -q --depth 1 origin diag-results 2>/dev/null; then git checkout -q -B diag-results FETCH_HEAD; else git switch -q --orphan diag-results; fi
          mkdir -p "$dest" && cp -r "$GITHUB_WORKSPACE/out/${{ matrix.name }}/." "$dest/"
          git add -A && git commit -qm "diag ${{ matrix.name }} ${{ github.run_id }}"
          for i in 1 2 3 4; do git push -q origin HEAD:diag-results && break; sleep $((i*5)); git fetch -q --depth 1 origin diag-results && git rebase -q FETCH_HEAD; done
